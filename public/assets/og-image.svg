    <path d="M150 72 C 200 72, 200 152, 250 152" stroke="#ECECE6" stroke-opacity="0.6" stroke-width="1.6" fill="none"/>
  </g>

  <!-- wordmark -->
  <text x="64" y="120" font-size="22" letter-spacing="8" fill="#9AA0A6" font-family="'JetBrains Mono', monospace">FILAMENT</text>

  <!-- headline -->
  <text x="60" y="300" font-size="92" font-weight="700" letter-spacing="-3" fill="#ECECE6">BUILD AI</text>
  <text x="60" y="392" font-size="92" font-weight="700" letter-spacing="-3" fill="#ECECE6">SYSTEMS</text>
  <text x="62" y="478" font-size="92" font-weight="700" letter-spacing="-3" fill="#E8FF52">VISUALLY</text>

  <text x="64" y="540" font-size="22" fill="#9AA0A6" font-family="Inter, Arial, sans-serif">Design, connect, and run enterprise AI workflows — like node-based programming.</text>

  <rect x="64" y="566" width="14" height="14" rx="2" fill="#E8FF52"/>
